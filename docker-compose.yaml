services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: capsstone-web

    env_file:
      - .env

    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"

    ports:
      - "8000:8000"

    command: ["sh", "-c", "uv run --no-sync python manage.py migrate && exec uv run --no-sync uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"]